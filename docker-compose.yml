services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nmcc}
      POSTGRES_USER: ${POSTGRES_USER:-nmcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nmcc}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: modules/app/Dockerfile
    image: ${DOCKER_IMAGE_API:-nmcc-api}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-nmcc}:${POSTGRES_PASSWORD:-nmcc}@postgres:5432/${POSTGRES_DB:-nmcc}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
